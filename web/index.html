<!DOCTYPE html>
<html>
<head>
  <!--
    Web / permisos de cámara:
    - No se declaran permisos en un archivo (no hay Manifest ni Info.plist).
    - El navegador usa getUserMedia y muestra su propio diálogo.
    - Solo funciona en contexto seguro: HTTPS o localhost.
    - Probar con: flutter run -d chrome
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Galería rápida — demo de cámara y galería. En Web, getUserMedia requiere HTTPS o localhost.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Galería rápida">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Galería rápida</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
